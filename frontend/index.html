<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FlyBreak</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #scene { position: fixed; inset: 0; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 16px; box-sizing: border-box; color: #b7f7c8;
    text-shadow: 0 0 6px rgba(90, 255, 140, 0.35);
  }
  .panel {
    pointer-events: auto;
    background: rgba(5, 15, 10, 0.55);
    border: 1px solid rgba(120, 255, 170, 0.25);
    border-radius: 6px;
    padding: 10px 12px;
    backdrop-filter: blur(2px);
    font-size: 12px;
    line-height: 1.5;
  }
  .row { display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; }
  .label { opacity: 0.65; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .regions { min-width: 190px; }
  .region-bar-track { background: rgba(120,255,170,0.12); border-radius: 3px; height: 5px; margin: 3px 0 6px; overflow: hidden; }
  .region-bar-fill { background: #5affa0; height: 100%; transition: width 0.15s linear; }
  .food-bar-fill { background: #ff9d3d; }

  #status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-connected { background: #5affa0; box-shadow: 0 0 6px #5affa0; }
  .status-disconnected { background: #ff5a5a; box-shadow: 0 0 6px #ff5a5a; }

  #mood-panel { width: 220px; }
  #mood-slider { width: 100%; accent-color: #ffd35a; }
  .mood-scale { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.65; margin-top: 2px; }
  #mood-mode-btn {
    pointer-events: auto; font: inherit; color: inherit; cursor: pointer;
    background: rgba(120,255,170,0.1); border: 1px solid rgba(120,255,170,0.35);
    border-radius: 4px; padding: 3px 8px; margin-top: 6px;
  }
  #mood-mode-btn:hover { background: rgba(120,255,170,0.2); }
</style>
</head>
<body>
<div id="scene"></div>

<div id="hud">
  <div class="top-row">
    <div class="panel">
      <div><span id="status-dot" class="status-disconnected"></span><span id="status-text">connecting...</span></div>
      <div class="row"><span class="label">tick</span><span id="tick">-</span></div>
      <div class="row"><span class="label">sim_time</span><span id="sim-time">-</span></div>
      <div class="row"><span class="label">spikes</span><span id="spikes">-</span></div>
      <div class="row"><span class="label">rate</span><span id="rate">-</span></div>
      <div class="row"><span class="label">action</span><span id="action">-</span></div>
      <div class="row"><span class="label">wing</span><span id="wing">-</span></div>
      <div class="row"><span class="label">food</span><span id="food-value">-</span></div>
      <div class="region-bar-track"><div class="region-bar-fill food-bar-fill" id="food-bar" style="width:0%"></div></div>
    </div>

    <div class="panel regions">
      <div class="label" style="margin-bottom:4px;">active_regions</div>
      <div id="region-list"></div>
    </div>
  </div>

  <div class="panel" id="mood-panel">
    <div class="row"><span class="label">mood_level</span><span id="mood-value">0.00</span></div>
    <input id="mood-slider" type="range" min="0" max="1" step="0.01" value="0" />
    <div class="mood-scale"><span>feliz</span><span>muy feliz</span><span>plena</span></div>
    <button id="mood-mode-btn" type="button">mode: auto</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---- WebSocket client: connects to the FlyBreak engine, reconnects on drop ----
  const WS_URL = (window.FLYBREAK_WS_URL) || ("ws://" + location.hostname + ":8765");
  let ws = null;
  let latest = null;

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => setStatus(true);
    ws.onclose = () => { setStatus(false); setTimeout(connect, 1000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (event) => {
      try {
        latest = JSON.parse(event.data);
        renderHud(latest);
      } catch (e) {
        // a malformed frame from the engine must not crash the HUD
        console.error("bad tick", e);
      }
    };
  }

  function setStatus(connected) {
    document.getElementById("status-dot").className = connected ? "status-connected" : "status-disconnected";
    document.getElementById("status-text").textContent = connected ? "engine connected" : "reconnecting...";
  }

  function sendControl(message) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
  }

  // ---- HUD ----
  function renderHud(tick) {
    document.getElementById("tick").textContent = tick.tick;
    document.getElementById("sim-time").textContent = Math.round(tick.sim_time_ms) + " ms";
    document.getElementById("spikes").textContent = tick.activity.spike_count;
    document.getElementById("rate").textContent = tick.activity.firing_rate_hz.toFixed(1) + " Hz";
    document.getElementById("action").textContent = tick.motor_state.action;
    document.getElementById("wing").textContent = tick.motor_state.wing_state;

    const foodPct = Math.round(tick.activity.food_activity * 100);
    document.getElementById("food-value").textContent = foodPct + "%";
    document.getElementById("food-bar").style.width = foodPct + "%";
    foodActivity = tick.activity.food_activity;

    const list = document.getElementById("region-list");
    list.innerHTML = "";
    for (const r of tick.activity.active_regions) {
      const pct = Math.round(r.activity * 100);
      const row = document.createElement("div");
      row.innerHTML =
        '<div class="row"><span>' + r.region + '</span><span>' + pct + '%</span></div>' +
        '<div class="region-bar-track"><div class="region-bar-fill" style="width:' + pct + '%"></div></div>';
      list.appendChild(row);
    }

    // don't fight the user's finger: only sync the slider when they are not
    // actively dragging it.
    if (!draggingSlider) {
      slider.value = tick.stimulus.mood_level;
    }
    document.getElementById("mood-value").textContent = tick.stimulus.mood_level.toFixed(2);

    applyMotorState(tick.motor_state);
  }

  // ---- mood_level control: hybrid (auto ramp in the engine, manual override
  // here). One continuous slider, "feliz" (0) to "plena" (1); "muy feliz" is
  // just its labeled midpoint, not a separate discrete state. ----
  const slider = document.getElementById("mood-slider");
  const modeBtn = document.getElementById("mood-mode-btn");
  let draggingSlider = false;
  let mode = "auto";

  slider.addEventListener("pointerdown", () => { draggingSlider = true; });
  slider.addEventListener("input", () => {
    document.getElementById("mood-value").textContent = parseFloat(slider.value).toFixed(2);
    sendControl({ type: "set_mood_level", value: parseFloat(slider.value) });
    setMode("manual");
  });
  slider.addEventListener("pointerup", () => { draggingSlider = false; });

  modeBtn.addEventListener("click", () => {
    if (mode === "manual") {
      sendControl({ type: "set_mood_mode", value: "auto" });
      setMode("auto");
    }
  });

  function setMode(next) {
    mode = next;
    modeBtn.textContent = "mode: " + mode + (mode === "manual" ? " (tap to release)" : "");
  }

  // ---- Three.js scene: wireframe city + the fly ----
  const container = document.getElementById("scene");
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05070a, 0.012);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 14, 28);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x05070a);
  container.appendChild(renderer.domElement);

  const gridColor = 0x1c5a3a;
  scene.add(new THREE.GridHelper(200, 40, gridColor, gridColor));

  const cityGroup = new THREE.Group();
  scene.add(cityGroup);
  const buildingMat = new THREE.MeshBasicMaterial({ color: 0x2ecf7a, wireframe: true });
  const rng = mulberry32(7);
  for (let i = 0; i < 60; i++) {
    const w = 1 + rng() * 2.5;
    const h = 2 + rng() * 18;
    const d = 1 + rng() * 2.5;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
    const angle = rng() * Math.PI * 2;
    const radius = 15 + rng() * 70;
    box.position.set(Math.cos(angle) * radius, h / 2, Math.sin(angle) * radius);
    cityGroup.add(box);
  }

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // the fly: a small wireframe body + two wing planes
  const fly = new THREE.Group();
  const flyMat = new THREE.MeshBasicMaterial({ color: 0xff5a5a, wireframe: true });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 6), flyMat);
  fly.add(body);
  const wingGeo = new THREE.PlaneGeometry(1.1, 0.5);
  const wingMat = new THREE.MeshBasicMaterial({ color: 0xffd35a, wireframe: true, side: THREE.DoubleSide });
  const wingL = new THREE.Mesh(wingGeo, wingMat); wingL.position.set(-0.7, 0.2, 0);
  const wingR = new THREE.Mesh(wingGeo, wingMat); wingR.position.set(0.7, 0.2, 0);
  fly.add(wingL, wingR);
  fly.position.set(0, 3, 0);
  scene.add(fly);

  // the food source: a static, always-present prop (net.food_mask's
  // gustatory sugar/water population). No spatial navigation exists yet
  // (see README "Where this is headed"), so this is a fixed landmark, not
  // something the fly walks toward -- it just visually pulses with the
  // real food_activity value each tick.
  const foodMat = new THREE.MeshBasicMaterial({ color: 0xff9d3d, wireframe: true, transparent: true, opacity: 0.5 });
  const food = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1, 1), foodMat);
  food.position.set(6, 1.4, 5);
  scene.add(food);
  let foodActivity = 0.3; // baseline noise floor until the first tick arrives

  let wingFlap = 0;
  function applyMotorState(motorState) {
    fly.rotation.y = THREE.MathUtils.degToRad(motorState.heading_deg);
    fly.userData.speed = motorState.speed;
    fly.userData.action = motorState.action;
    fly.userData.wingState = motorState.wing_state;
  }

  function animate() {
    requestAnimationFrame(animate);

    const speed = (fly.userData.speed || 0);
    const action = fly.userData.action || "idle";
    if (action === "flying") {
      fly.position.y = 3 + Math.sin(performance.now() / 300) * 0.6;
    } else {
      fly.position.y = 1.2;
    }
    fly.position.x += Math.sin(fly.rotation.y) * speed * 0.05;
    fly.position.z += Math.cos(fly.rotation.y) * speed * 0.05;

    const wingState = fly.userData.wingState || "folded";
    const flapSpeed = wingState === "buzzing" ? 0.9 : wingState === "raised" ? 0.25 : 0;
    wingFlap += flapSpeed;
    const flapAngle = wingState === "folded" ? 1.4 : Math.sin(wingFlap) * 0.6;
    wingL.rotation.z = flapAngle;
    wingR.rotation.z = -flapAngle;

    // food source pulses with food_activity: higher activity -> faster
    // pulse, bigger swing, more opaque wireframe.
    const foodPeriod = 500 - foodActivity * 300;
    const foodPulse = 1 + Math.sin(performance.now() / foodPeriod) * (0.1 + foodActivity * 0.35);
    food.scale.setScalar(foodPulse);
    food.rotation.y += 0.002 + foodActivity * 0.01;
    foodMat.opacity = 0.3 + foodActivity * 0.6;

    camera.position.x = Math.sin(performance.now() / 20000) * 30;
    camera.position.z = 28 + Math.cos(performance.now() / 20000) * 10;
    camera.lookAt(fly.position);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  connect();
})();
</script>
</body>
</html>
