<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FlyBreak</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #scene { position: fixed; inset: 0; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 16px; box-sizing: border-box; color: #b7f7c8;
    text-shadow: 0 0 6px rgba(90, 255, 140, 0.35);
  }
  .panel {
    pointer-events: auto;
    background: rgba(5, 15, 10, 0.55);
    border: 1px solid rgba(120, 255, 170, 0.25);
    border-radius: 6px;
    padding: 10px 12px;
    backdrop-filter: blur(2px);
    font-size: 12px;
    line-height: 1.5;
  }
  .row { display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; }
  .label { opacity: 0.65; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .regions { min-width: 190px; }
  .region-bar-track { background: rgba(120,255,170,0.12); border-radius: 3px; height: 5px; margin: 3px 0 6px; overflow: hidden; }
  .region-bar-fill { background: #5affa0; height: 100%; transition: width 0.15s linear; }
  .food-bar-fill { background: #ff9d3d; }

  #status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-connected { background: #5affa0; box-shadow: 0 0 6px #5affa0; }
  .status-disconnected { background: #ff5a5a; box-shadow: 0 0 6px #ff5a5a; }

  #mood-panel { width: 220px; }
  #mood-slider { width: 100%; accent-color: #ffd35a; }
  .mood-scale { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.65; margin-top: 2px; }
  #mood-mode-btn {
    pointer-events: auto; font: inherit; color: inherit; cursor: pointer;
    background: rgba(120,255,170,0.1); border: 1px solid rgba(120,255,170,0.35);
    border-radius: 4px; padding: 3px 8px; margin-top: 6px;
  }
  #mood-mode-btn:hover { background: rgba(120,255,170,0.2); }

  #synapse-panel {
    position: absolute; right: 16px; bottom: 16px;
    width: 360px;
  }
  #synapse-panel .label { margin-bottom: 4px; }
  #synapse-canvas { display: block; width: 100%; height: auto; aspect-ratio: 720 / 520; }
  #synapse-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; font-size: 10px; opacity: 0.85; }
  #synapse-legend span.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<div id="scene"></div>

<div id="hud">
  <div class="top-row">
    <div class="panel">
      <div><span id="status-dot" class="status-disconnected"></span><span id="status-text">connecting...</span></div>
      <div class="row"><span class="label">tick</span><span id="tick">-</span></div>
      <div class="row"><span class="label">sim_time</span><span id="sim-time">-</span></div>
      <div class="row"><span class="label">spikes</span><span id="spikes">-</span></div>
      <div class="row"><span class="label">rate</span><span id="rate">-</span></div>
      <div class="row"><span class="label">action</span><span id="action">-</span></div>
      <div class="row"><span class="label">wing</span><span id="wing">-</span></div>
      <div class="row"><span class="label">food</span><span id="food-value">-</span></div>
      <div class="region-bar-track"><div class="region-bar-fill food-bar-fill" id="food-bar" style="width:0%"></div></div>
    </div>

    <div class="panel regions">
      <div class="label" style="margin-bottom:4px;">active_regions</div>
      <div id="region-list"></div>
    </div>
  </div>

  <div class="panel" id="mood-panel">
    <div class="row"><span class="label">mood_level</span><span id="mood-value">0.00</span></div>
    <input id="mood-slider" type="range" min="0" max="1" step="0.01" value="0" />
    <div class="mood-scale"><span>feliz</span><span>muy feliz</span><span>plena</span></div>
    <button id="mood-mode-btn" type="button">mode: auto</button>
  </div>

  <div class="panel" id="synapse-panel">
    <div class="label" id="synapse-label">synapse map (waiting for graph...)</div>
    <canvas id="synapse-canvas" width="720" height="520"></canvas>
    <div id="synapse-legend">
      <span><span class="dot" style="background:#4ad8ff;"></span>visual</span>
      <span><span class="dot" style="background:#ffffff;"></span>motor</span>
      <span><span class="dot" style="background:#ff9d3d;"></span>food</span>
      <span><span class="dot" style="background:#3a5a4a;"></span>other</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---- WebSocket client: connects to the FlyBreak engine, reconnects on drop ----
  const WS_URL = (window.FLYBREAK_WS_URL) || ("ws://" + location.hostname + ":8765");
  let ws = null;
  let latest = null;

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => setStatus(true);
    ws.onclose = () => { setStatus(false); setTimeout(connect, 1000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        // the one-time synapse_graph message (sent once, right when the
        // socket opens, before any tick) is distinguished from a regular
        // tick by having a `type` field -- a tick payload never does.
        if (msg.type === "synapse_graph") {
          buildSynapseGraph(msg);
          return;
        }
        latest = msg;
        renderHud(latest);
      } catch (e) {
        // a malformed frame from the engine must not crash the HUD
        console.error("bad tick", e);
      }
    };
  }

  function setStatus(connected) {
    document.getElementById("status-dot").className = connected ? "status-connected" : "status-disconnected";
    document.getElementById("status-text").textContent = connected ? "engine connected" : "reconnecting...";
  }

  function sendControl(message) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
  }

  // ---- HUD ----
  function renderHud(tick) {
    document.getElementById("tick").textContent = tick.tick;
    document.getElementById("sim-time").textContent = Math.round(tick.sim_time_ms) + " ms";
    document.getElementById("spikes").textContent = tick.activity.spike_count;
    document.getElementById("rate").textContent = tick.activity.firing_rate_hz.toFixed(1) + " Hz";
    document.getElementById("action").textContent = tick.motor_state.action;
    document.getElementById("wing").textContent = tick.motor_state.wing_state;

    const foodPct = Math.round(tick.activity.food_activity * 100);
    document.getElementById("food-value").textContent = foodPct + "%";
    document.getElementById("food-bar").style.width = foodPct + "%";
    foodActivity = tick.activity.food_activity;

    // each landmark's own real proximity to the fly's actual position
    // (tick.motor_state.position) -- used below so food/water pulse
    // independently even though they honestly share one real signal.
    const pos = tick.motor_state.position;
    foodProximity = proximityWeight(pos.x, pos.z, FOOD_POSITION.x, FOOD_POSITION.z);
    waterProximity = proximityWeight(pos.x, pos.z, WATER_POSITION.x, WATER_POSITION.z);

    const list = document.getElementById("region-list");
    list.innerHTML = "";
    const regionMap = new Map();
    for (const r of tick.activity.active_regions) {
      regionMap.set(r.region, r.activity);
      const pct = Math.round(r.activity * 100);
      const row = document.createElement("div");
      row.innerHTML =
        '<div class="row"><span>' + r.region + '</span><span>' + pct + '%</span></div>' +
        '<div class="region-bar-track"><div class="region-bar-fill" style="width:' + pct + '%"></div></div>';
      list.appendChild(row);
    }

    // don't fight the user's finger: only sync the slider when they are not
    // actively dragging it.
    if (!draggingSlider) {
      slider.value = tick.stimulus.mood_level;
    }
    document.getElementById("mood-value").textContent = tick.stimulus.mood_level.toFixed(2);

    // fly 0 (the controlled fly): real position/heading/action/wing state,
    // plus the only fly with real neural introspection -- its body parts
    // are driven by their corresponding real region activity.
    applyFlyState(flies[0], tick.motor_state);
    driveFlyRegions(flies[0], regionMap, tick.activity.food_activity);

    // the other two flies: real position/heading/action/wing_state only --
    // no activity/stimulus is ever sent for them (see server.py), so their
    // anatomy stays generic/non-region-driven (see createFlyMesh/driveFlyRegions).
    const others = tick.world.other_flies;
    for (let i = 0; i < others.length && i + 1 < flies.length; i++) {
      applyFlyState(flies[i + 1], others[i]);
    }

    // real per-tick spikes from the synapse sample (fly 0 only, same as
    // activity/stimulus always have been -- see world.other_flies loop
    // above, which never gets this).
    applySynapseSpikes(tick.activity.sample_spikes);
  }

  // ---- mood_level control: hybrid (auto ramp in the engine, manual override
  // here). One continuous slider, "feliz" (0) to "plena" (1); "muy feliz" is
  // just its labeled midpoint, not a separate discrete state. ----
  const slider = document.getElementById("mood-slider");
  const modeBtn = document.getElementById("mood-mode-btn");
  let draggingSlider = false;
  let mode = "auto";

  slider.addEventListener("pointerdown", () => { draggingSlider = true; });
  slider.addEventListener("input", () => {
    document.getElementById("mood-value").textContent = parseFloat(slider.value).toFixed(2);
    sendControl({ type: "set_mood_level", value: parseFloat(slider.value) });
    setMode("manual");
  });
  slider.addEventListener("pointerup", () => { draggingSlider = false; });

  modeBtn.addEventListener("click", () => {
    if (mode === "manual") {
      sendControl({ type: "set_mood_mode", value: "auto" });
      setMode("auto");
    }
  });

  function setMode(next) {
    mode = next;
    modeBtn.textContent = "mode: " + mode + (mode === "manual" ? " (tap to release)" : "");
  }

  // ---- synapse map: a real ~250-neuron / ~1000-edge induced subgraph of
  // the actual FlyWire connectome (see contract/schema_graph_v1.json),
  // sent once per connection as the "synapse_graph" message, rendered here
  // as its own 2D canvas HUD panel so ~250 nodes don't have to be force-
  // simulated live at 20Hz. Layout is computed exactly once, when that
  // message arrives, and never reshuffled again -- only per-tick spike
  // activity (tick.activity.sample_spikes) animates on top of it. This is
  // fly-0-only, same as activity/stimulus always have been; other_flies
  // never gets a graph of its own (see server.py). Kept independent of
  // THREE/the 3D scene below -- pure canvas 2D, no library. ----
  const synapseCanvas = document.getElementById("synapse-canvas");
  const synapseCtx = synapseCanvas.getContext("2d");
  const synapseLabel = document.getElementById("synapse-label");
  const SYNAPSE_W = synapseCanvas.width;
  const SYNAPSE_H = synapseCanvas.height;
  const GOLDEN_ANGLE = 2.3999632297286535; // radians; deterministic even fill, no RNG

  let synapseGraph = null;      // { nodes, edges } as received, unmodified
  let synapseLayout = null;     // [{x,y}, ...] indexed by node id, fixed after first build
  let synapseAdjacency = null;  // [[edgeIndex, ...], ...] indexed by node id
  let nodeFlash = null;         // Float32Array 0..1, per node id, decays every tick
  let edgeFlash = null;         // Float32Array 0..1, per edge index, decays every tick

  // real region string -> the same body-part accent color this project
  // already uses for that region on the fly's own anatomy (PART_COLORS
  // above), so the graph panel and the 3D fly read as one color language.
  // is_food/is_motor/is_visual are checked in this priority order when a
  // sampled node (rare, but real) carries more than one flag; nodes with
  // none of the three (expected -- real neurons reached by BFS beyond the
  // seed populations, not an error) fall back to a neutral dim tone.
  const SYNAPSE_NODE_COLOR = {
    visual: "#4ad8ff", // matches PART_COLORS.eyes.bright
    motor: "#ffffff",  // matches PART_COLORS.legs.bright
    food: "#ff9d3d",   // matches PART_COLORS.proboscis.bright / the food landmark
    neutral: "#3a5a4a",
  };
  function synapseNodeColor(node) {
    if (node.is_visual) return SYNAPSE_NODE_COLOR.visual;
    if (node.is_motor) return SYNAPSE_NODE_COLOR.motor;
    if (node.is_food) return SYNAPSE_NODE_COLOR.food;
    return SYNAPSE_NODE_COLOR.neutral;
  }

  // deterministic, non-random layout: cluster nodes by their real `region`
  // string, place clusters evenly around a circle (sorted region names, so
  // it's stable/reproducible), and fill each cluster disc with a
  // golden-angle spiral (even spread, no overlap, no RNG, no physics
  // library) -- computed once, here, and never touched again.
  function computeSynapseLayout(graph) {
    const cx = SYNAPSE_W / 2, cy = SYNAPSE_H / 2;
    const outerR = Math.min(SYNAPSE_W, SYNAPSE_H) * 0.40;
    const byRegion = new Map();
    for (let i = 0; i < graph.nodes.length; i++) {
      const region = graph.nodes[i].region;
      if (!byRegion.has(region)) byRegion.set(region, []);
      byRegion.get(region).push(i);
    }
    const regions = Array.from(byRegion.keys()).sort();
    const layout = new Array(graph.nodes.length);
    regions.forEach((region, ri) => {
      const angle = (ri / regions.length) * Math.PI * 2 - Math.PI / 2;
      const clusterCx = cx + Math.cos(angle) * outerR;
      const clusterCy = cy + Math.sin(angle) * outerR;
      const members = byRegion.get(region);
      const clusterR = Math.max(16, Math.min(60, 8 + members.length * 1.4));
      members.forEach((nodeIdx, mi) => {
        const frac = (mi + 0.5) / members.length;
        const r = clusterR * Math.sqrt(frac);
        const a = mi * GOLDEN_ANGLE;
        layout[nodeIdx] = { x: clusterCx + Math.cos(a) * r, y: clusterCy + Math.sin(a) * r };
      });
    });
    return layout;
  }

  // called once, the moment the one-time synapse_graph message arrives.
  function buildSynapseGraph(graph) {
    synapseGraph = graph;
    nodeFlash = new Float32Array(graph.nodes.length);
    edgeFlash = new Float32Array(graph.edges.length);
    synapseAdjacency = Array.from({ length: graph.nodes.length }, () => []);
    graph.edges.forEach((e, idx) => {
      if (synapseAdjacency[e.source]) synapseAdjacency[e.source].push(idx);
      if (synapseAdjacency[e.target]) synapseAdjacency[e.target].push(idx);
    });
    synapseLayout = computeSynapseLayout(graph);
    // real count from the actual received message, not a hardcoded guess --
    // the real engine's sample size may differ slightly from what's documented.
    synapseLabel.textContent = "synapse map (" + graph.nodes.length + " real neurons)";
    drawSynapseFrame();
  }

  // called every tick with tick.activity.sample_spikes (the local ids that
  // genuinely spiked that specific tick, possibly empty). Existing flash on
  // every node/edge decays a bit first (a brief pulse that fades over the
  // next few ticks, not a permanent state change), then freshly spiked
  // nodes -- and the real edges directly touching them -- light back up to
  // full/partial brightness.
  const FLASH_DECAY = 0.72;
  function applySynapseSpikes(sampleSpikes) {
    if (!synapseGraph) return;
    for (let i = 0; i < nodeFlash.length; i++) nodeFlash[i] *= FLASH_DECAY;
    for (let i = 0; i < edgeFlash.length; i++) edgeFlash[i] *= FLASH_DECAY;
    if (sampleSpikes) {
      for (const id of sampleSpikes) {
        if (id < 0 || id >= nodeFlash.length) continue;
        nodeFlash[id] = 1;
        for (const edgeIdx of synapseAdjacency[id]) {
          edgeFlash[edgeIdx] = Math.max(edgeFlash[edgeIdx], 0.65);
        }
      }
    }
    drawSynapseFrame();
  }

  function drawSynapseFrame() {
    if (!synapseGraph || !synapseLayout) return;
    const ctx = synapseCtx;
    ctx.clearRect(0, 0, SYNAPSE_W, SYNAPSE_H);

    const edges = synapseGraph.edges;
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      const a = synapseLayout[e.source], b = synapseLayout[e.target];
      if (!a || !b) continue;
      const flash = edgeFlash[i];
      if (flash > 0.03) {
        ctx.strokeStyle = "rgba(255, 211, 90, " + Math.min(1, 0.25 + flash * 0.75).toFixed(3) + ")";
        ctx.lineWidth = 1.3;
      } else {
        const w = Math.min(0.2, Math.abs(e.weight) * 0.1);
        ctx.strokeStyle = "rgba(120, 255, 170, " + (0.05 + w).toFixed(3) + ")";
        ctx.lineWidth = 0.5;
      }
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    const nodes = synapseGraph.nodes;
    for (let i = 0; i < nodes.length; i++) {
      const p = synapseLayout[i];
      if (!p) continue;
      const node = nodes[i];
      const flash = nodeFlash[i];
      const flagged = node.is_food || node.is_motor || node.is_visual;
      const r = (flagged ? 2.6 : 1.8) + flash * 3.2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      if (flash > 0.03) {
        ctx.fillStyle = "rgba(255, 244, 214, " + Math.min(1, 0.55 + flash * 0.45).toFixed(3) + ")";
      } else {
        ctx.globalAlpha = flagged ? 0.9 : 0.5;
        ctx.fillStyle = synapseNodeColor(node);
      }
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // ---- Three.js scene: wireframe city + the fly ----
  const container = document.getElementById("scene");
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05070a, 0.012);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 6, 10);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x05070a);
  container.appendChild(renderer.domElement);

  const gridColor = 0x1c5a3a;
  scene.add(new THREE.GridHelper(200, 40, gridColor, gridColor));

  const cityGroup = new THREE.Group();
  scene.add(cityGroup);
  const buildingMat = new THREE.MeshBasicMaterial({ color: 0x2ecf7a, wireframe: true });
  const rng = mulberry32(7);
  for (let i = 0; i < 60; i++) {
    const w = 1 + rng() * 2.5;
    const h = 2 + rng() * 18;
    const d = 1 + rng() * 2.5;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
    const angle = rng() * Math.PI * 2;
    const radius = 15 + rng() * 70;
    box.position.set(Math.cos(angle) * radius, h / 2, Math.sin(angle) * radius);
    cityGroup.add(box);
  }

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- fly anatomy: a reusable factory, since we now need 3 flies on
  // screen (this fly + tick.world.other_flies) instead of one. Every
  // material stays wireframe:true, matching the rest of the scene's unlit
  // aesthetic -- "activity glow" is always faked via color brightness /
  // opacity, never a real light (same trick the food pulse already used).
  function col(hex) { return new THREE.Color(hex); }

  // dim/bright color pairs per body part. Only fly 0 (the controlled fly)
  // ever gets lerped toward "bright" -- see driveFlyRegions(). The other
  // two flies keep the dim tone fixed, because tick.world.other_flies
  // deliberately carries no activity/stimulus for them (no per-region
  // introspection into a fly you don't control -- see server.py).
  const PART_COLORS = {
    eyes: { dim: col(0x1a2a33), bright: col(0x5ad8ff) },       // optic + visual_projection + visual_centrifugal
    antennae: { dim: col(0x33301a), bright: col(0xffd35a) },   // sensory + sensory_ascending
    abdomen: { dim: col(0x331a2b), bright: col(0xff5ad3) },    // endocrine
    legs: { dim: col(0x2a2a2a), bright: col(0xffffff) },       // motor + descending
    proboscis: { dim: col(0x331f10), bright: col(0xff9d3d) },  // food_activity directly (gustatory, not a region)
  };

  function makeMat(color, opacity) {
    return new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity: opacity == null ? 0.55 : opacity });
  }

  // an elongated, tapered outline (quadratic-curve Shape) instead of a bare
  // rectangle, so the wireframe actually reads as a wing. Scaled down (0.45)
  // so a wingspan (both wings, tip to tip) comes out close to the thorax's
  // own length -- a fly wing, not a moth/dragonfly wing.
  function makeWingGeometry() {
    const s = 0.45;
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.quadraticCurveTo(0.35 * s, 0.18 * s, 0.95 * s, 0.06 * s);
    shape.quadraticCurveTo(1.15 * s, 0, 0.95 * s, -0.14 * s);
    shape.quadraticCurveTo(0.4 * s, -0.22 * s, 0, 0);
    return new THREE.ShapeGeometry(shape, 8);
  }
  const wingGeo = makeWingGeometry();
  const legGeo = new THREE.CylinderGeometry(0.025, 0.045, 0.62, 4);
  const antennaGeo = new THREE.CylinderGeometry(0.015, 0.05, 0.38, 4);
  const eyeGeo = new THREE.SphereGeometry(0.11, 8, 6);

  // createFlyMesh(bodyColor) -> { group, parts, wingL, wingR }
  //   group: the THREE.Group to add to the scene / position+rotate each tick
  //   parts: { eyes, antennae, thorax, abdomen, legs, proboscis } -> arrays
  //          of MeshBasicMaterial, for driveFlyRegions() to color per-tick
  //   wingL/wingR: mesh refs, for the wing-flap animation
  function createFlyMesh(bodyColor) {
    const group = new THREE.Group();
    const parts = { eyes: [], antennae: [], thorax: [], abdomen: [], legs: [], proboscis: [] };

    function add(geo, mat, pos, rot, scale) {
      const m = new THREE.Mesh(geo, mat);
      if (pos) m.position.set(pos[0], pos[1], pos[2]);
      if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
      if (scale) m.scale.set(scale[0], scale[1], scale[2]);
      group.add(m);
      return m;
    }

    // thorax: main body mass -- where wings and legs attach. z-scale kept
    // modest (1.15, not 1.35) so its front edge (~0.58) sits well clear of
    // the head cluster instead of poking into it.
    const thoraxMat = makeMat(bodyColor);
    add(new THREE.SphereGeometry(0.42, 8, 6), thoraxMat, [0, 0, 0.1], [0, 0, 0], [1, 0.85, 1.15]);
    parts.thorax.push(thoraxMat);

    // abdomen: tapering cone behind the thorax, its wide base overlapping
    // just into the thorax's (now shorter) rear edge for a connected look.
    const abdomenMat = makeMat(PART_COLORS.abdomen.dim);
    add(new THREE.ConeGeometry(0.36, 1.5, 8), abdomenMat, [0, -0.02, -1.0], [-Math.PI / 2, 0, 0]);
    parts.abdomen.push(abdomenMat);

    // head: small sphere, pushed clear in front of the thorax (thorax's own
    // front edge is ~0.58) so it reads as a separate, distinct head instead
    // of a tangle of overlapping wireframes at the body's front. headZ=0.95
    // (not 0.88) widens the thorax-to-head gap to ~0.15 units -- the
    // previous 0.08 gap was numerically real but visually invisible once
    // the (oversized) eyes bridged the two, see eyeGeo's comment.
    const headZ = 0.95;
    const headMat = makeMat(0x555555);
    add(new THREE.SphereGeometry(0.22, 8, 6), headMat, [0, 0.05, headZ]);

    // eyes: bulge from the sides of the head like real compound eyes, but
    // sized clearly smaller than the head itself (radius 0.11 vs the
    // head's 0.22) so they read as two distinct lobes, not a second sphere
    // nearly engulfing the head -- that was the actual cause of the
    // tangled-blob look, not the thorax/head gap.
    for (const side of [-1, 1]) {
      const m = makeMat(PART_COLORS.eyes.dim);
      add(eyeGeo, m, [side * 0.27, 0.07, headZ + 0.03]);
      parts.eyes.push(m);
    }

    // antennae: thin cones angled forward off the head.
    for (const side of [-1, 1]) {
      const m = makeMat(PART_COLORS.antennae.dim);
      add(antennaGeo, m, [side * 0.1, 0.24, headZ + 0.17], [0.95, 0, side * 0.3]);
      parts.antennae.push(m);
    }

    // proboscis/mouth: small cone at the front of the head, pointing
    // down/forward -- driven directly by food_activity, not a region.
    const proboscisMat = makeMat(PART_COLORS.proboscis.dim);
    add(new THREE.ConeGeometry(0.06, 0.26, 6), proboscisMat, [0, -0.11, headZ + 0.07], [2.3, 0, 0]);
    parts.proboscis.push(proboscisMat);

    // legs: 3 pairs of straight cylinder segments off the thorax underside.
    const legZ = [0.27, -0.04, -0.33];
    const legTiltX = [-0.35, 0, 0.35];
    for (let i = 0; i < 3; i++) {
      for (const side of [-1, 1]) {
        const m = makeMat(PART_COLORS.legs.dim);
        add(legGeo, m, [side * 0.38, -0.3, legZ[i]], [legTiltX[i], 0, -side * 0.6]);
        parts.legs.push(m);
      }
    }

    // wings: one geometry, mirrored via scale.x for the left side. Attached
    // close to the body centerline (0.16, not 0.26) so, combined with the
    // shrunk geometry above, tip-to-tip span comes out comparable to the
    // thorax's own length rather than 2-3x the body width.
    const wingMat = new THREE.MeshBasicMaterial({ color: 0xffd35a, wireframe: true, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
    const wingR = add(wingGeo, wingMat, [0.16, 0.32, 0.05]);
    const wingL = add(wingGeo, wingMat, [-0.16, 0.32, 0.05], null, [-1, 1, 1]);

    return { group, parts, wingL, wingR };
  }

  // ---- 3 flies: fly 0 (controlled, red, region-driven) + 2 others
  // (position/heading/action/wing_state only, from tick.world.other_flies) ----
  const FLY_COLORS = [0xff5a5a, 0x7fa8c9, 0xb98fd1];
  const THORAX_COLORS_BY_FLY = FLY_COLORS.map((hex) => {
    const bright = new THREE.Color(hex);
    const dim = bright.clone().multiplyScalar(0.35);
    return { dim, bright };
  });
  const flies = [];
  for (let i = 0; i < 3; i++) {
    const built = createFlyMesh(FLY_COLORS[i]);
    const inst = {
      id: i,
      group: built.group,
      parts: built.parts,
      wingL: built.wingL,
      wingR: built.wingR,
      wingFlap: 0,
      action: "idle",
      wingState: "folded",
      targetPos: { x: i === 0 ? 0 : (i === 1 ? 2 : -2), z: i === 0 ? 0 : (i === 1 ? 2 : -2) },
    };
    inst.group.position.set(inst.targetPos.x, 1.2, inst.targetPos.z);
    scene.add(inst.group);
    flies.push(inst);
  }
  const fly0 = flies[0];

  // fly 0's real position/heading/action/wing_state (tick.motor_state), or
  // an other fly's real position/heading/action/wing_state
  // (tick.world.other_flies[i]) -- same shape, so one function applies both.
  function applyFlyState(instance, state) {
    instance.group.rotation.y = THREE.MathUtils.degToRad(state.heading_deg);
    instance.action = state.action;
    instance.wingState = state.wing_state;
    instance.targetPos.x = state.position.x;
    instance.targetPos.z = state.position.z;
  }

  // fly 0 only: color each body part from its real corresponding region
  // activity (tick.activity.active_regions, looked up via the Map built
  // once per tick in renderHud) or, for the proboscis, food_activity
  // directly. The other 2 flies never call this -- see PART_COLORS comment.
  const _tmpColor = new THREE.Color();
  function applyActivityColor(mats, value, colors) {
    const v = Math.max(0, Math.min(1, value || 0));
    _tmpColor.copy(colors.dim).lerp(colors.bright, v);
    for (const m of mats) {
      m.color.copy(_tmpColor);
      m.opacity = 0.3 + v * 0.6;
    }
  }
  function driveFlyRegions(instance, regionMap, foodActivityValue) {
    const get = (name) => regionMap.get(name) || 0;
    const optic = (get("optic") + get("visual_projection") + get("visual_centrifugal")) / 3;
    const sensory = (get("sensory") + get("sensory_ascending")) / 2;
    const central = get("central");
    const motor = (get("motor") + get("descending")) / 2;
    const endocrine = get("endocrine");

    applyActivityColor(instance.parts.eyes, optic, PART_COLORS.eyes);
    applyActivityColor(instance.parts.antennae, sensory, PART_COLORS.antennae);
    applyActivityColor(instance.parts.thorax, central, THORAX_COLORS_BY_FLY[instance.id]);
    applyActivityColor(instance.parts.legs, motor, PART_COLORS.legs);
    applyActivityColor(instance.parts.abdomen, endocrine, PART_COLORS.abdomen);
    applyActivityColor(instance.parts.proboscis, foodActivityValue, PART_COLORS.proboscis);
  }

  // ---- landmarks: food (existing) + water (new) ----
  // Both drive off the one real net.food_mask channel (tick.activity.food_activity
  // -- see server.py's WATER_POSITION comment: the connectome has no separate
  // "water" neuron population, so there is no separate water_activity field).
  const FOOD_POSITION = { x: 6, z: 5 };
  const WATER_POSITION = { x: -6, z: -5 };

  const foodMat = new THREE.MeshBasicMaterial({ color: 0xff9d3d, wireframe: true, transparent: true, opacity: 0.5 });
  const food = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1, 1), foodMat);
  food.position.set(FOOD_POSITION.x, 1.4, FOOD_POSITION.z);
  scene.add(food);

  // water: distinct shape (torus, not another icosahedron) and a cool
  // cyan color so it reads as "water" even without relying on color alone.
  const waterMat = new THREE.MeshBasicMaterial({ color: 0x4ad8ff, wireframe: true, transparent: true, opacity: 0.5 });
  const water = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.32, 8, 16), waterMat);
  water.position.set(WATER_POSITION.x, 1.4, WATER_POSITION.z);
  scene.add(water);

  let foodActivity = 0.3; // baseline noise floor until the first tick arrives
  let foodProximity = 0;
  let waterProximity = 0;
  // a real (if rough) function of the fly's real current position vs each
  // landmark's own fixed position -- not a fabricated per-landmark signal.
  function proximityWeight(px, pz, lx, lz) {
    const d2 = (px - lx) * (px - lx) + (pz - lz) * (pz - lz);
    return 1 / (1 + d2 * 0.02);
  }

  // the engine is the single source of truth for each fly's x/z position;
  // we just ease the rendered mesh toward the latest tick's value each
  // animated frame so ~20Hz ticks don't look like ~60fps teleports.
  const POSITION_LERP = 0.12;

  function updateFlyInstance(instance) {
    const action = instance.action || "idle";
    if (action === "flying") {
      instance.group.position.y = 3 + Math.sin(performance.now() / 300 + instance.id * 2) * 0.6;
    } else {
      instance.group.position.y = 1.2;
    }
    instance.group.position.x += (instance.targetPos.x - instance.group.position.x) * POSITION_LERP;
    instance.group.position.z += (instance.targetPos.z - instance.group.position.z) * POSITION_LERP;

    const wingState = instance.wingState || "folded";
    const flapSpeed = wingState === "buzzing" ? 0.9 : wingState === "raised" ? 0.25 : 0;
    instance.wingFlap += flapSpeed;
    const flapAngle = wingState === "folded" ? 1.4 : Math.sin(instance.wingFlap) * 0.6;
    instance.wingL.rotation.z = flapAngle;
    instance.wingR.rotation.z = -flapAngle;
  }

  function animate() {
    requestAnimationFrame(animate);

    for (const instance of flies) updateFlyInstance(instance);

    // each landmark pulses by food_activity * ITS OWN local proximity
    // weight -- honestly grounded in real position data, not a copy of the
    // same raw number on both (see proximityWeight comment above).
    const foodPulseVal = foodActivity * foodProximity;
    const foodPeriod = 500 - foodPulseVal * 300;
    const foodPulse = 1 + Math.sin(performance.now() / foodPeriod) * (0.1 + foodPulseVal * 0.35);
    food.scale.setScalar(foodPulse);
    food.rotation.y += 0.002 + foodPulseVal * 0.01;
    foodMat.opacity = 0.3 + foodPulseVal * 0.6;

    const waterPulseVal = foodActivity * waterProximity;
    const waterPeriod = 500 - waterPulseVal * 300;
    const waterPulse = 1 + Math.sin(performance.now() / waterPeriod) * (0.1 + waterPulseVal * 0.35);
    water.scale.setScalar(waterPulse);
    water.rotation.y += 0.002 + waterPulseVal * 0.01;
    waterMat.opacity = 0.3 + waterPulseVal * 0.6;

    // orbit close enough that the fly and its anatomy are actually legible
    // (was 28-38 units out -- a few pixels on screen at that range, no
    // amount of geometry detail reads at that distance) while still
    // swinging past some city buildings for atmosphere.
    camera.position.x = Math.sin(performance.now() / 20000) * 6;
    camera.position.y = 6;
    camera.position.z = 10 + Math.cos(performance.now() / 20000) * 3;
    camera.lookAt(fly0.group.position);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  connect();
})();
</script>
</body>
</html>
